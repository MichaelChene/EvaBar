name: Deploy Eva|Bar website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: evabar-site-production
      cancel-in-progress: true
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
        timeout-minutes: 5
      - run: npm run check
      - name: Build and verify the release download
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          DEPLOY_LATEST_RELEASE: ${{ github.event_name == 'push' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Package Vercel build output
        run: |
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          printf '%s\n' '{"version":3}' > .vercel/output/config.json
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN repository secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID repository variable}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID repository variable}"
          npx --yes vercel@66.5.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
